[project]
name = "so101-sim"
version = "0.1.0"
description = "SO-101 MuJoCo simulation for privileged RL and visual policy distillation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.16.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
exclude = [".venv", "third_party", "outputs"]

[dependency-groups]
dev = [
    "mujoco-stubs[mujoco]>=3.16,<3.17",
    "pyright>=1.1.414",
]
